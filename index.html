<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open House Itinerary</title>
<meta name="theme-color" content="#241A2E">
<meta name="description" content="Schedule and locations for the Overdevest Nurseries open house.">

<script>
/* ==========================================================================
   EDIT EVERYTHING IN THIS BLOCK. Nothing below it needs to be touched.
   Anything left as "" shows up as an orange ADD THIS chip on the page
   while EDIT_MODE is true. Set EDIT_MODE to false before you go live.
   ========================================================================== */

/* ⚑ OFF as of 2026-08-26 — the schedule is real now. While this was true, every
   blank field printed an orange "ADD THIS" chip, which is a working note to
   whoever is filling the page in and is not something a visitor should ever
   see. Turn it back on while editing; turn it off before the QR code goes up. */
const EDIT_MODE = false;

const CONFIG = {
  eventName:  "Open House",
  orgName:    "Overdevest Nurseries",                       // e.g. "Willow Creek Nursery"
  dateISO:    "2026-08-26",             // YYYY-MM-DD. Drives the live "Right now" clock.
  dateLabel:  "Wednesday, August 26",
  venue:      "",                       // intentionally blank — orgName already prints above the title
  // ⚑ BLANK ON PURPOSE (Caryn, 2026-08-26): everyone reading this is already
  // standing on the property. An address at the foot of the page is a line
  // that helps nobody and takes up the last thing they see.
  address:    "",
  mapsUrl:    "",                       // not needed — guests are already on site

  contactName:  "",                     // not needed — guests already know who to ask
  contactPhone: "",                     // blank = no call button rendered
  wifiNetwork:  "",                     // no guest wi-fi listed — blank hides the line
  wifiPassword: "",

  // Short practical lines. Add or delete freely. Each string becomes one bulleted
  // row under "Good to know". Empty strings render as blank rows, so keep the
  // array empty until there is real copy to put in it.
  // Parked for later — layout still undecided:
  //   "Restrooms are behind the food tent."
  //   "Parking: enter off the main road."
  //   "Closed-toe shoes recommended. Bring a hat and sunscreen."
  // Each line is its own little card. Lead with an emoji — it is the whole of
  // the "cute", it costs nothing, and it gives the eye something to land on.
  goodToKnow: [
    "🦩 See a flamingo? Check it out — everyone knows flamingos flock near all the interesting plants.",
    "💛 Have a question? Ask an employee in yellow."
  ],

  // ---- THE SCHEDULE -------------------------------------------------------
  // start / end   24-hour clock, "HH:MM"
  // title         short. It is set in condensed caps on the page.
  // location      where it happens — shows as a chip
  // details       a sentence or two. What it is, what to expect, what to bring.
  // stops         optional sub-items (used for the tour block)
  // photo         optional image URL, or leave "" for none
  // mapsUrl       optional Google Maps link for that specific spot
  schedule: [
    {
      start: "08:30", end: "09:00",
      title: "Check In",
      location: "Tractor Barn",
      details:  "Stop over after arrival to get your goodies & name tag.",
      photo: "", mapsUrl: ""
    },
    {
      start: "09:00", end: "11:00",
      title: "Nursery & Garden Tours",
      // no single location: the three things below happen in three places, and
      // each one says where it is rather than the block claiming one spot
      location: "",
      details:  "",
      stops: [
        { name: "Rose Garden",
          details: "Hang out with Rebecca Koraytem of David Austin Roses in our Trial Rose Garden.",
          photo: "", mapsUrl: "" },
        { name: "Display Gardens",
          details: "Join David, Sue and Lauren on a guided tour to explore the display plantings around our office. Jeff will be serving up hot popcorn!",
          photo: "", mapsUrl: "" },
        { name: "Nursery Tours",
          details: "Leave from the Tractor Barn at 9:00 and 10:00. Hop on a wagon and get a tour of our nursery!",
          photo: "", mapsUrl: "" },
        { name: "Drone Demo",
          details: "Flights leaving at 9:30am and 10:30am from the Tractor Barn. Get a bird's eye view.",
          photo: "", mapsUrl: "" }
      ],
      photo: "", mapsUrl: ""
    },
    {
      start: "11:00", end: "12:00",
      title: "Display Contest",
      location: "Loading Dock",
      details:  "Bring the creativity! We've set up a chopped-style display contest. Cash prize for the winning team!",
      photo: "", mapsUrl: ""
    },
    {
      start: "12:00", end: "13:00",
      title: "Meet, Greet & Eat",
      location: "Tractor Barn",
      details:  "Lunch catered by a local BBQ pro — come for the knowledge, stay for the flavor explosion.",
      photo: "", mapsUrl: ""
    },
    {
      start: "13:00", end: "15:00",
      title: "New Idea Session",
      location: "Tractor Barn",
      // ⚑ both halves are NAMED. A bare paragraph sitting above a headed stop
      // read as an orphan — everything under a block has a heading now.
      details:  "",
      stops: [
        { name: "Talk Shop",
          details: "Gather with fellow IGCs. What do you want to brag about? What could have been executed better? Get and give inspiration.",
          photo: "", mapsUrl: "" },
        { name: "Emerging Favorites",
          details: "David shares a few selections he's excited about. Ones not to miss next season!",
          photo: "", mapsUrl: "" }
      ],
      photo: "", mapsUrl: ""
    }
  ],

  // ---- GROUNDS MAP --------------------------------------------------------
  // Set to false to hide the map section entirely.
  // To use a photo of your own map instead, put its URL in mapImage.
  //
  // ⚑ OFF, Caryn 2026-08-26: there are no colour groups to map any more, so a
  // map of them would be a page telling people to look for something that does
  // not exist. Every stop names its own location instead. The PlantPicks
  // cross-link was reworded to match — it used to promise a map.
  showMap: false,
  mapImage: "",           // put a photo/scan of a real map here to replace the blank canvas
  mapCaption: ""          // blank while the map itself is blank
};

/* ====================== END OF THE EDITABLE BLOCK ========================= */
</script>

<style>
  /* ⚑ THE HANDOUT'S PURPLES (Caryn, 2026-08-26: "keep the purple theme and
     make it cute"). These are the exact values PlantPicks uses, because the
     two pages link to each other and a guest moves between them in one visit —
     they should read as one thing, not two.
     The ink was a deep GREEN and the page a neutral tan; matching the body
     text by making it all near-black is what prompted this. Body copy is now
     --p-deep, a purple dark enough to read in daylight (about 9:1 on white)
     but unmistakably purple. */
  :root{
    --glass:#f5f0fa;        /* soft lavender page wash (was a neutral tan) */
    --glass-deep:#e7dcf0;   /* deeper wash — meter track */
    --pine:#241a2e;         /* purple-black — the strongest ink */
    --p:#7b4e9e;            /* the handout's brand purple */
    --p-deep:#5e3a79;       /* body copy on white */
    --p-mid:#9b7bba;        /* dots, rules, quiet marks */
    --p-soft:#c9b4dc;       /* hairlines */
    --leaf:#9b7bba;         /* primary — buttons and outlines */
    --leaf-soft:#ecd7f0;
    --tag:#e2d2e9;          /* plant-tag lavender — reserved for NOW */
    --flag:#7b4e9e;         /* flagging tape — alerts and unfilled fields */
    /* ⚑ DARKENED 2026-08-26 — Caryn: "the contrast is too low". It was
       #6b6076, which technically passes AA (5.9:1 on white, 5.3:1 on the page
       wash) and still reads badly on a phone held outdoors, which is the only
       place this page is ever read. 8.2:1 / 7.3:1 now — AAA on both. */
    --slate:#574a63;        /* secondary text */
    --card:#ffffff;
    --line:#e4dcec;
    --shadow:0 1px 0 rgba(36,26,46,.05), 0 6px 18px -10px rgba(36,26,46,.40);

    --display:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Helvetica,sans-serif;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--glass);
    color:var(--pine);
    font-family:var(--body);
    font-size:17px;
    line-height:1.5;
    padding-bottom:calc(84px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 18px}

  /* ---------- header ---------- */
  .masthead{
    background:var(--pine);
    color:var(--glass);
    padding:18px 0 16px;
    border-bottom:4px solid var(--tag);
  }
  .masthead h1{
    font-family:var(--display);
    font-size:clamp(30px,9vw,44px);
    line-height:.95;
    letter-spacing:.02em;
    text-transform:uppercase;
    margin:0;
    font-weight:700;
  }
  .masthead .org{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--tag);
    margin:0 0 6px;
  }
  .masthead .when{
    font-family:var(--mono);
    font-size:13px;
    color:rgba(239,233,223,.8);
    margin:8px 0 0;
  }

  /* ---------- right now ---------- */
  .now-section{padding-top:22px;padding-bottom:6px}
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--slate);
    margin:0 0 10px;
  }
  .now-card{
    background:var(--card);
    border:1px solid var(--line);
    border-left:6px solid var(--tag);
    border-radius:4px;
    padding:16px 16px 14px;
    box-shadow:var(--shadow);
  }
  .now-card.idle{border-left-color:var(--slate)}
  /* ⚑ --leaf is 3.5:1 on white — fine for a border, not for words. Every TEXT
     use of it moved to --p (6.1:1); the borders and fills keep --leaf. This
     one is read outdoors, in sun, at 13px. */
  .now-time{
    font-family:var(--mono);
    font-size:13px;
    /* the brand purple is 6.1:1 — right for a 16px bold time, thin at 13px
       regular, so this one takes the deeper purple (8.9:1) */
    color:var(--p-deep);
    letter-spacing:.04em;
    margin:0 0 2px;
  }
  .now-title{
    font-family:var(--display);
    text-transform:uppercase;
    font-size:clamp(24px,7vw,32px);
    line-height:1.02;
    letter-spacing:.01em;
    margin:0;
    font-weight:700;
  }
  .now-where{margin:8px 0 0;font-size:15px;color:var(--slate)}
  .meter{
    height:8px;
    background:var(--glass-deep);
    border-radius:99px;
    overflow:hidden;
    margin:14px 0 6px;
  }
  .meter span{
    display:block;height:100%;
    background:var(--tag);
    border-radius:99px;
    transition:width .6s linear;
  }
  .meter-label{font-family:var(--mono);font-size:12px;color:var(--slate);margin:0}
  .up-next{
    margin:10px 0 0;
    font-size:14px;
    color:var(--slate);
  }
  .up-next b{color:var(--pine);font-weight:600}

  /* ---------- schedule ---------- */
  .schedule{padding-top:26px;padding-bottom:8px}
  .rail{position:relative;padding-left:34px}
  .rail::before{
    content:"";position:absolute;left:11px;top:6px;bottom:6px;
    width:2px;background:var(--line);
  }
  .block{position:relative;margin:0 0 12px}
  .block::before{                       /* the stake marker */
    content:"";position:absolute;left:-28px;top:20px;
    width:12px;height:12px;border-radius:2px;
    background:var(--glass);
    border:2px solid var(--leaf-soft);
    transform:rotate(45deg);
  }
  .block.is-done::before{background:var(--leaf-soft);border-color:var(--leaf-soft)}
  .block.is-now::before{background:var(--tag);border-color:var(--tag);box-shadow:0 0 0 5px rgba(152,101,168,.28)}

  /* the header of a block. No longer a control — see the note where it is
     built. The rounded corners are only at the TOP now, because the panel
     below it is always there and the two read as one card. */
  .tag{
    width:100%;
    text-align:left;
    background:var(--card);
    border:1px solid var(--line);
    border-bottom:0;
    border-radius:10px 10px 0 0;
    padding:14px 14px 12px;
    font:inherit;
    color:inherit;
    position:relative;
    box-shadow:var(--shadow);
    display:block;
  }
  .block.is-now .tag{
    border-color:var(--tag);
    border-left:5px solid var(--tag);
    padding-left:10px;
  }
  .block.is-now .panel{border-color:var(--tag);border-left:5px solid var(--tag);padding-left:10px}
  .block.is-done .tag{opacity:.55;box-shadow:none}
  .block.is-done .panel{opacity:.55;box-shadow:none}
  .tag:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}

  /* ⚑ THE TIME IS THE POINT (Caryn, 2026-08-26). Someone glancing at this
     between conversations is looking for "what is happening now" and "when is
     the next thing" — not for the name of the block. It was 12.5px in the pale
     lavender, which is quieter than the location line underneath it. Now it is
     the loudest small thing on the card: bigger, bolder, and in the ink. The
     duration stays quiet beside it — it is context, not the answer. */
  .tag-time{
    font-family:var(--mono);
    font-size:16px;
    font-weight:700;
    letter-spacing:.01em;
    color:var(--p);
    display:block;
    margin-bottom:5px;
  }
  .tag-time .dur{
    font-weight:400;
    font-size:13px;
    color:var(--slate);
    letter-spacing:.03em;
  }
  .block.is-now .tag-time{color:var(--flag)}
  .block.is-done .tag-time{color:var(--slate)}
  .block.is-done .tag-time .dur{color:var(--slate)}
  .tag-title{
    font-family:var(--display);
    text-transform:uppercase;
    font-size:21px;
    line-height:1.05;
    letter-spacing:.01em;
    font-weight:700;
    display:block;
  }
  .tag-where{
    display:block;margin-top:5px;
    font-size:14px;color:var(--slate);
  }
  /* the expand chevron and its rules are gone with the dropdown — nothing on
     the page collapses, so an arrow pointing at nothing would be a lie */

  .badge{
    display:inline-block;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.16em;
    text-transform:uppercase;
    padding:3px 7px;
    border-radius:3px;
    vertical-align:2px;
    margin-left:8px;
  }
  .badge.now{background:var(--tag);color:var(--pine)}
  .badge.next{background:var(--p);color:#fff}

  /* always open — there is no dropdown any more */
  .panel{
    display:block;
    background:var(--card);
    border:1px solid var(--line);
    border-top:0;
    border-radius:0 0 10px 10px;
    box-shadow:var(--shadow);
    padding:0 14px 14px;
  }
  .panel > p{margin:10px 0 0}
  /* ⚑ SAME TEXT, SAME LOOK, AND STILL PURPLE (Caryn, 2026-08-26). A stop's
     description was 15px grey while a block's was 15.5px, so the Rose Garden
     read as a footnote next to Lunch. Matching them by making both near-black
     drained the page, so they match in --p-deep instead: one rule, one colour,
     and the colour is the handout's. */
  .panel p, .stops p{font-size:15.5px;line-height:1.45;color:var(--p-deep)}
  /* ⚑ A BLOCK'S OWN LINE READS LIKE A STOP NAME (Caryn, 2026-08-26: lines like
     "Stop over after arrival…" should be the same size and format as lines
     like "Rose Garden"). A block without bulleted stops has just the one
     sentence, and at body size it read quieter than the tour block's headed
     list next to it. Direct children only — the sentences UNDER a stop name
     (.stops li p) stay body copy, or the tours block would be all caps. */
  .panel > p{
    font-family:var(--display);
    text-transform:uppercase;
    letter-spacing:.04em;
    font-size:16px;
    font-weight:700;
    line-height:1.3;
    color:var(--p);
  }
  .panel img{width:100%;border-radius:3px;margin-top:12px;display:block}

  /* ⚑ THE SUB-ITEMS HANG OFF THEIR BLOCK (Caryn, 2026-08-26: make it clearer
     they fall under the larger heading). Three things say so at once, because
     one was not enough: they are INDENTED, a lavender rule runs down the left
     of the whole group tying them to it, and each one starts with a dot. */
  .stops{
    list-style:none;
    margin:12px 0 2px;
    padding:2px 0 2px 16px;
    border-left:2px solid var(--p-soft);
  }
  .stops li{padding:10px 0 0}
  .stops li:first-child{padding-top:0}
  .stop-name{
    font-family:var(--display);
    text-transform:uppercase;
    letter-spacing:.04em;
    font-size:16px;
    font-weight:700;
    display:block;
    margin-bottom:4px;
    color:var(--p);
    position:relative;
  }
  /* the dot sits OUT in the indent, level with the cap-height of the name, so
     the name's own left edge stays flush with everything else in the group */
  .stop-name::before{
    content:"";
    position:absolute;
    left:-23px; top:.5em;
    width:7px; height:7px;
    border-radius:50%;
    background:var(--p-mid);
    box-shadow:0 0 0 3px var(--card);
  }

  .go{
    display:inline-block;
    margin-top:12px;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--p);
    border:1.5px solid var(--leaf);
    border-radius:3px;
    padding:8px 12px;
  }
  .go:active{background:var(--leaf);color:#fff}

  /* ---------- map ---------- */
  .map-section{padding-top:26px;padding-bottom:8px}
  .map-frame{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:10px;
    box-shadow:var(--shadow);
  }
  .map-frame svg,.map-frame img{width:100%;height:auto;display:block}
  .cap{font-family:var(--mono);font-size:11.5px;color:var(--slate);margin:9px 2px 0}

  /* ---------- good to know ---------- */
  .info{padding-top:26px;padding-bottom:34px}
  /* ⚑ CUTE (Caryn, 2026-08-26). These were rows between hairlines, which read
     as small print — the flamingo deserves better than small print. Each line
     is its own soft card now, on a lavender tint, with the leading emoji
     pulled out into its own column so the text lines up under itself instead
     of wrapping back under the picture. */
  .info ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
  .info li{
    background:var(--card);
    border:1px solid var(--p-soft);
    border-radius:14px;
    padding:13px 15px;
    font-size:15.5px;
    line-height:1.45;
    color:var(--pine);
    box-shadow:var(--shadow);
    /* the emoji sits in the first column, the words in the second */
    display:grid;
    grid-template-columns:auto 1fr;
    gap:11px;
    align-items:start;
  }
  .info li .emoji{font-size:22px;line-height:1.15}
  .calls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .calls a{
    flex:1 1 46%;
    text-align:center;
    text-decoration:none;
    background:var(--leaf);
    color:#fff;
    font-family:var(--display);
    text-transform:uppercase;
    letter-spacing:.05em;
    font-size:17px;
    padding:14px 10px;
    border-radius:4px;
  }
  .calls a.ghost{background:transparent;color:var(--p);border:1.5px solid var(--leaf)}

  /* ---------- sticky jump bar ---------- */
  /* the way across to the plant tool — quiet, and last on the page */
  .crosslink{padding-bottom:96px}
  .crosslink a{
    display:block;text-decoration:none;color:var(--pine);
    background:var(--card);border:1.5px solid var(--leaf);border-radius:12px;
    padding:14px 16px;box-shadow:var(--shadow);
  }
  .crosslink a:active{background:var(--leaf-soft)}
  .crosslink b{display:block;font-family:var(--display);font-size:19px;letter-spacing:.4px}
  .crosslink span{display:block;color:var(--slate);font-size:13.5px;margin-top:3px}

  .jumpbar{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--pine);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:12px;
    z-index:20;
  }
  .jumpbar .status{
    flex:1;min-width:0;
    font-family:var(--mono);
    font-size:12px;
    color:rgba(239,233,223,.85);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .jumpbar .status b{color:var(--tag);font-weight:600}
  .jumpbar button{
    background:var(--tag);color:var(--pine);
    border:0;border-radius:4px;
    font-family:var(--display);text-transform:uppercase;
    letter-spacing:.06em;font-size:15px;font-weight:700;
    padding:11px 16px;cursor:pointer;flex:none;
  }
  .jumpbar button:focus-visible{outline:3px solid var(--glass);outline-offset:2px}

  /* ---------- edit-mode markers ---------- */
  .todo{
    display:inline-block;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    background:var(--flag);
    color:#fff;
    padding:3px 7px;
    border-radius:3px;
  }
  .editnote{
    background:var(--flag);color:#fff;
    font-family:var(--mono);font-size:12.5px;
    padding:10px 18px;line-height:1.4;
  }

  /* ⚑ PHONE WIDTHS (Caryn, 2026-08-26: "too wide on a cell phone, the right
     side needs more space"). The real culprit was the section padding above —
     .schedule/.info/.now-section each used the padding SHORTHAND after .wrap,
     which zeroed the 18px side gutters .wrap had just set, so every card ran
     hard into both screen edges and the words sat 14px from the right.
     With the gutters back, the only remaining lopsidedness is the timeline
     rail, which is decoration and only eats space on the LEFT. On a 390px
     screen 34px of it is nearly a tenth of the display, so it gives some back
     — enough to widen the cards without touching the right-hand gap she
     asked for. */
  @media (max-width:430px){
    .rail{padding-left:26px}
    .block::before{left:-22px;width:10px;height:10px}
    .rail::before{left:8px}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  }

  @media print{
    .jumpbar,.now-section,.editnote{display:none}
    body{background:#fff;padding:0;font-size:12pt}
    .panel{border:0;box-shadow:none;padding:0 0 0 14px}
    .tag{box-shadow:none;border:0;page-break-inside:avoid}
    .block{page-break-inside:avoid}
    .masthead{background:#fff;color:#000;border-bottom:2px solid #000}
    .masthead h1,.masthead .org,.masthead .when{color:#000}
  }
</style>
</head>
<body>

<div id="editnote"></div>

<header class="masthead">
  <div class="wrap">
    <p class="org" id="org"></p>
    <h1 id="event-name">Open House</h1>
    <p class="when" id="when"></p>
  </div>
</header>

<main>
  <section class="now-section wrap" id="now-section">
    <p class="eyebrow">Right now</p>
    <div class="now-card" id="now-card"></div>
  </section>

  <section class="schedule wrap">
    <!-- said "tap any block" while the blocks were dropdowns. They are not any
         more, and an instruction to tap something that does nothing is worse
         than no instruction at all. -->
    <p class="eyebrow">Full schedule</p>
    <div class="rail" id="rail"></div>
  </section>

  <section class="map-section wrap" id="map-section" hidden>
    <p class="eyebrow">The grounds</p>
    <div class="map-frame" id="map-frame"></div>
    <p class="cap" id="map-cap"></p>
  </section>

  <section class="info wrap">
    <p class="eyebrow">Good to know</p>
    <ul id="info-list"></ul>
    <div class="calls" id="calls"></div>
  </section>

  <!-- Across to the plant tool. A plain path, not a full URL: both pages sit
       on the same host, so this keeps working if the site ever moves. The
       extra bottom margin clears the fixed "Jump to now" bar. -->
  <section class="wrap crosslink">
    <a href="/plantpicks/">
      <b>New Plant Selections 2027</b>
      <span>Follow along, rate the plants and keep your own notes</span>
    </a>
  </section>
</main>

<div class="jumpbar">
  <div class="status" id="jump-status"></div>
  <button type="button" id="jump-btn">Jump to now</button>
</div>

<script>
(function(){
  "use strict";
  const C = CONFIG;
  const $  = (s,r) => (r||document).querySelector(s);
  const el = (t,c,txt)=>{const n=document.createElement(t); if(c)n.className=c; if(txt!=null)n.textContent=txt; return n;};
  const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  /* A field that hasn't been filled in yet. In edit mode it shouts; live, it just disappears. */
  function fill(value, hint){
    if (value) return esc(value);
    return EDIT_MODE ? '<span class="todo">Add ' + esc(hint) + '</span>' : "";
  }
  const has = v => !!v || EDIT_MODE;

  /* ---------- time ---------- */
  const [Y,M,D] = C.dateISO.split("-").map(Number);
  const at = hhmm => { const [h,m]=hhmm.split(":").map(Number); return new Date(Y,M-1,D,h,m,0,0); };
  const fmt = d => {
    let h=d.getHours(), m=d.getMinutes();
    const ap = h>=12 ? "pm" : "am";
    h = h%12 || 12;
    return h + (m ? ":"+String(m).padStart(2,"0") : "") + ap;
  };
  const range = b => fmt(at(b.start)) + "–" + fmt(at(b.end));
  const mins  = ms => Math.max(0, Math.round(ms/60000));
  const dur   = n => n>=60 ? Math.floor(n/60)+" hr "+(n%60?(n%60)+" min":"") : n+" min";

  const blocks = C.schedule.map(b => Object.assign({}, b, {startAt: at(b.start), endAt: at(b.end)}));

  function state(now){
    let current=null, next=null;
    for (const b of blocks){
      if (now >= b.startAt && now < b.endAt){ current = b; }
      if (!next && now < b.startAt){ next = b; }
    }
    const first = blocks[0], last = blocks[blocks.length-1];
    let phase = "during";
    if (now < first.startAt) phase = "before";
    else if (now >= last.endAt) phase = "after";
    return {current, next, phase, first, last};
  }

  /* ---------- header ---------- */
  $("#event-name").textContent = C.eventName || "Open House";
  const org = $("#org");
  if (C.orgName) org.textContent = C.orgName; else if (EDIT_MODE) org.innerHTML = fill("", "your nursery name");
  $("#when").innerHTML = [fill(C.dateLabel,"date"), fill(C.venue,"venue")].filter(Boolean).join(" &nbsp;·&nbsp; ");

  /* ---------- schedule ---------- */
  const rail = $("#rail");
  blocks.forEach((b,i)=>{
    const wrapEl = el("div","block");
    wrapEl.id = "block-"+i;

    /* ⚑ A HEADING, NOT A BUTTON (Caryn, 2026-08-26). Everything under it is
       always on screen now, so there is nothing to expand — and a button that
       does nothing is worse than no button: it still takes keyboard focus and
       still announces itself as pressable to a screen reader. The whole
       schedule reads top to bottom, which is what someone walking round with
       one hand full actually wants. */
    const btn = el("div","tag");
    btn.innerHTML =
      '<span class="tag-time">'+esc(range(b))+' <span class="dur">· '+dur(mins(b.endAt-b.startAt))+'</span></span>' +
      '<span class="tag-title">'+esc(b.title)+'<span class="badge" hidden></span></span>' +
      (has(b.location) ? '<span class="tag-where">'+fill(b.location,"location")+'</span>' : "");

    const panel = el("div","panel");
    panel.id = "panel-"+i;

    if (has(b.details)) panel.innerHTML += "<p>"+fill(b.details,"what happens here")+"</p>";

    if (b.stops && b.stops.length){
      const ul = el("ul","stops");
      b.stops.forEach(s=>{
        const li = el("li");
        li.innerHTML = '<span class="stop-name">'+esc(s.name)+'</span>' +
                       (has(s.details) ? "<p>"+fill(s.details,"details")+"</p>" : "");
        if (s.photo){ const im=el("img"); im.src=s.photo; im.alt=s.name; im.loading="lazy"; li.appendChild(im); }
        if (s.mapsUrl){ const a=el("a","go","Find it on the map"); a.href=s.mapsUrl; a.target="_blank"; a.rel="noopener"; li.appendChild(a); }
        else if (EDIT_MODE){ li.insertAdjacentHTML("beforeend",'<p>'+fill("","map link")+'</p>'); }
        ul.appendChild(li);
      });
      panel.appendChild(ul);
    }

    if (b.photo){ const im=el("img"); im.src=b.photo; im.alt=b.title; im.loading="lazy"; panel.appendChild(im); }
    else if (EDIT_MODE){ panel.insertAdjacentHTML("beforeend",'<p>'+fill("","photo so people recognize the spot")+'</p>'); }

    if (b.mapsUrl){ const a=el("a","go","Get directions"); a.href=b.mapsUrl; a.target="_blank"; a.rel="noopener"; panel.appendChild(a); }

    /* no click handler: nothing collapses any more */

    wrapEl.appendChild(btn);
    wrapEl.appendChild(panel);
    rail.appendChild(wrapEl);
  });

  /* ---------- live tick ---------- */
  const nowCard = $("#now-card");
  const jumpStatus = $("#jump-status");

  function tick(){
    const now = new Date();
    const s = state(now);

    /* the hero card */
    if (s.phase === "before"){
      nowCard.className = "now-card idle";
      nowCard.innerHTML =
        '<p class="now-time">Doors at '+esc(fmt(s.first.startAt))+'</p>' +
        '<h2 class="now-title">Not started yet</h2>' +
        '<p class="up-next">First up: <b>'+esc(s.first.title)+'</b></p>';
    } else if (s.phase === "after"){
      nowCard.className = "now-card idle";
      nowCard.innerHTML =
        '<p class="now-time">'+esc(fmt(s.last.endAt))+'</p>' +
        '<h2 class="now-title">That\u2019s a wrap</h2>' +
        '<p class="up-next">Thanks for coming out.</p>';
    } else if (s.current){
      const total = s.current.endAt - s.current.startAt;
      const gone  = now - s.current.startAt;
      const pct   = Math.min(100, Math.max(0, (gone/total)*100));
      const left  = mins(s.current.endAt - now);
      nowCard.className = "now-card";
      nowCard.innerHTML =
        '<p class="now-time">'+esc(range(s.current))+'</p>' +
        '<h2 class="now-title">'+esc(s.current.title)+'</h2>' +
        (has(s.current.location) ? '<p class="now-where">'+fill(s.current.location,"location")+'</p>' : "") +
        '<div class="meter"><span style="width:'+pct.toFixed(1)+'%"></span></div>' +
        '<p class="meter-label">'+dur(left)+' left</p>' +
        (s.next ? '<p class="up-next">Next at '+esc(fmt(s.next.startAt))+': <b>'+esc(s.next.title)+'</b></p>' : "");
    } else {
      /* gap between blocks */
      nowCard.className = "now-card idle";
      nowCard.innerHTML =
        '<p class="now-time">Between sessions</p>' +
        '<h2 class="now-title">Free time</h2>' +
        (s.next ? '<p class="up-next">Next at '+esc(fmt(s.next.startAt))+': <b>'+esc(s.next.title)+'</b> in '+dur(mins(s.next.startAt-now))+'</p>' : "");
    }

    /* block states + badges */
    blocks.forEach((b,i)=>{
      const node = document.getElementById("block-"+i);
      const badge = node.querySelector(".badge");
      node.classList.toggle("is-now",  s.current === b);
      node.classList.toggle("is-done", now >= b.endAt);
      badge.hidden = true;
      badge.className = "badge";
      if (s.current === b){ badge.hidden=false; badge.classList.add("now"); badge.textContent="Now"; }
      else if (s.next === b && s.phase !== "after"){ badge.hidden=false; badge.classList.add("next"); badge.textContent="Next"; }
    });

    /* sticky bar */
    if (s.current) jumpStatus.innerHTML = "Now: <b>"+esc(s.current.title)+"</b>";
    else if (s.next) jumpStatus.innerHTML = "Next: <b>"+esc(s.next.title)+"</b> at "+esc(fmt(s.next.startAt));
    else jumpStatus.textContent = C.dateLabel || "";
  }

  tick();
  setInterval(tick, 30000);

  $("#jump-btn").addEventListener("click", ()=>{
    const s = state(new Date());
    const target = s.current || s.next || blocks[0];
    const i = blocks.indexOf(target);
    const node = document.getElementById("block-"+i);
    /* nothing to expand any more — scrolling to it IS arriving at it */
    node.scrollIntoView({behavior:"smooth", block:"center"});
  });

  /* ---------- good to know ---------- */
  const list = $("#info-list");
  /* Each line is a card with the emoji in its own column, so a long line wraps
     under ITSELF rather than tucking back under the picture. A line that
     starts with no emoji still gets the column, filled with a quiet dot, or
     the cards would not line up with each other. */
  const infoRow = (emoji, html) => {
    const li = el("li");
    li.innerHTML = '<span class="emoji">' + emoji + '</span><span>' + html + '</span>';
    list.appendChild(li);
    return li;
  };
  (C.goodToKnow||[]).forEach((t)=>{
    const m = String(t).match(/^(\p{Extended_Pictographic}️?)\s*(.*)$/u);
    if (m) infoRow(esc(m[1]), esc(m[2]));
    else infoRow("•", esc(t));
  });
  if (C.address || EDIT_MODE){
    infoRow("📍", "<strong>Address:</strong> " + fill(C.address,"street address"));
  }
  if (C.wifiNetwork){
    infoRow("📶", "<strong>Wi-Fi:</strong> " + esc(C.wifiNetwork)
      + (C.wifiPassword ? " · password " + esc(C.wifiPassword) : ""));
  }

  const calls = $("#calls");
  if (C.contactPhone){
    const a = el("a", null, "Call " + (C.contactName || "us"));
    a.href = "tel:" + C.contactPhone.replace(/[^0-9+]/g,"");
    calls.appendChild(a);
  }
  if (C.mapsUrl){
    const a = el("a","ghost","Directions here");
    a.href = C.mapsUrl; a.target="_blank"; a.rel="noopener";
    calls.appendChild(a);
  }

  /* ---------- map ---------- */
  if (C.showMap){
    const sec = $("#map-section"); sec.hidden = false;
    const frame = $("#map-frame");
    if (C.mapImage){
      const im = el("img"); im.src = C.mapImage; im.alt = "Map of the grounds"; frame.appendChild(im);
    } else {
      frame.innerHTML = siteMapSVG();
    }
    $("#map-cap").textContent = C.mapCaption || "";
  }

  /* ---------- edit-mode banner ---------- */
  if (EDIT_MODE){
    $("#editnote").innerHTML =
      '<div class="editnote">EDIT MODE — orange chips mark what still needs filling in. ' +
      'Open this file in a text editor, edit the CONFIG block at the top, then set EDIT_MODE to false before printing the QR code.</div>';
  }
})();

/* --------------------------------------------------------------------------
   The grounds map — INTENTIONALLY BLANK, to be drawn later.

   Three ways to fill it in:
     1. Drop a photo/scan of a real map into CONFIG.mapImage — easiest, and
        it replaces this blank canvas entirely.
     2. Draw shapes here inside the <svg>. The original sample layout (parking,
        check in, greenhouse, rose garden, nursery blocks, demo field, food
        tent) is kept beside this file as `grounds-map-original.svg` — paste
        its contents back in if you want it as a starting point.
     3. Set CONFIG.showMap to false to hide the section completely.
   -------------------------------------------------------------------------- */
function siteMapSVG(){ return `
<svg viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Map of the grounds — not yet drawn">
  <rect x="1" y="1" width="598" height="418" rx="4"
        fill="#faf7f1" stroke="#c9bfae" stroke-width="2" stroke-dasharray="8 6"/>
</svg>`; }
</script>
</body>
</html>
